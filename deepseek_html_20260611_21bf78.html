<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>INFINITY EARN - Earn Money</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <!-- Monetag Ads SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --accent: #667eea;
        }

        body.dark {
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --glass-bg: rgba(30, 41, 59, 0.6);
            --glass-border: rgba(71, 85, 105, 0.3);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.95);
            --accent: #818cf8;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Glassmorphism Container */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 12px;
        }

        .stat-item {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            padding: 12px 16px;
            max-width: 500px;
            margin: 0 auto;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }

        .nav-item i {
            font-size: 24px;
        }

        .nav-item.active {
            color: var(--accent);
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }

        /* Ad Container */
        .ad-progress {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 10px;
            margin: 10px 0;
        }

        .hidden {
            display: none;
        }

        .task-item {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-logo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
        }

        .withdraw-history-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--card-bg);
            margin-bottom: 8px;
            border-radius: 12px;
        }

        .rank-badge {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .rank-1 { background: gold; color: #000; }
        .rank-2 { background: silver; color: #000; }
        .rank-3 { background: #cd7f32; color: #000; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Pages -->
        <div id="home-page" class="page"></div>
        <div id="ads-page" class="page hidden"></div>
        <div id="refer-page" class="page hidden"></div>
        <div id="withdraw-page" class="page hidden"></div>
        <div id="profile-page" class="page hidden"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" data-page="home"><i class="fas fa-home"></i><span>Home</span></div>
        <div class="nav-item" data-page="ads"><i class="fas fa-tasks"></i><span>Ads Task</span></div>
        <div class="nav-item" data-page="refer"><i class="fas fa-users"></i><span>Refer</span></div>
        <div class="nav-item" data-page="withdraw"><i class="fas fa-money-bill-wave"></i><span>Withdraw</span></div>
        <div class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>Profile</span></div>
    </div>

    <div id="withdraw-modal" class="modal">
        <div class="modal-content">
            <h3>Withdraw Funds</h3>
            <select id="withdraw-method" class="btn-secondary" style="width:100%; margin:10px 0">
                <option value="Bkash">Bkash</option>
                <option value="Nagad">Nagad</option>
            </select>
            <input type="number" id="withdraw-amount" placeholder="Enter amount" class="btn-secondary" style="width:100%; margin:10px 0">
            <input type="text" id="withdraw-account" placeholder="Account Number" class="btn-secondary" style="width:100%; margin:10px 0">
            <button id="submit-withdraw" class="btn-primary">Request Withdrawal</button>
            <button onclick="closeModal()" class="btn-secondary" style="margin-top:10px">Cancel</button>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBXY_T6Zrkvb705xe3OPPuaCJ8opx3z6_0",
            authDomain: "oreo-92d94.firebaseapp.com",
            projectId: "oreo-92d94",
            storageBucket: "oreo-92d94.firebasestorage.app",
            messagingSenderId: "686553199438",
            appId: "1:686553199438:web:1e568d100011656ae5641f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        let user = tg.initDataUnsafe?.user || { id: Math.floor(Math.random() * 1000000), username: "guest_" + Date.now() };
        
        let currentUserId = `user_${user.id}`;
        let currentUserData = null;
        let settings = {};
        let oneTimeTasks = [];
        let currentPage = "home";
        let adWatchQueue = [];
        let showingAd = false;

        // Language
        let currentLang = "en";
        const translations = {
            en: { balance: "Balance", todayEarnings: "Today's Earnings", lifetimeEarnings: "Lifetime", tasksCompleted: "Tasks", streak: "Streak", rank: "Rank", watchAd: "Watch Rewarded Ad", copy: "Copy", referrals: "Referrals", withdrawalHistory: "Withdrawal History" },
            bn: { balance: "ব্যালেন্স", todayEarnings: "আজকের আয়", lifetimeEarnings: "সর্বমোট", tasksCompleted: "টাস্ক", streak: "ধারাবাহিকতা", rank: "র্যাঙ্ক", watchAd: "বিজ্ঞাপন দেখুন", copy: "কপি", referrals: "রেফারেল", withdrawalHistory: "উইথড্র ইতিহাস" }
        };

        function t(key) { return translations[currentLang][key] || key; }

        // Initialize
        async function init() {
            await loadSettings();
            await loadOneTimeTasks();
            await loadUserData();
            setupEventListeners();
            renderCurrentPage();
            setInterval(() => { if(currentPage === "home") renderHome(); }, 30000);
        }

        async function loadSettings() {
            const snapshot = await db.ref('admin/settings').once('value');
            settings = snapshot.val() || { minWithdrawAmount: 100, dailyAdLimit: 20, adRewardPoints: 20, referralRewardPoints: 50, supportLink: "https://t.me/infinityearn", pointsToBdtRate: 5000 };
        }

        async function loadOneTimeTasks() {
            const snapshot = await db.ref('tasks/oneTime').once('value');
            oneTimeTasks = [];
            snapshot.forEach(child => {
                if(child.val().isActive !== false) oneTimeTasks.push({ id: child.key, ...child.val() });
            });
        }

        async function loadUserData() {
            const snapshot = await db.ref(`users/${currentUserId}`).once('value');
            if(!snapshot.exists()) {
                const today = new Date().toDateString();
                currentUserData = {
                    username: user.username || user.first_name || "User",
                    balance: 0,
                    totalEarned: 0,
                    totalTasksCompleted: 0,
                    loginStreak: 1,
                    lastLoginDate: today,
                    isBanned: false,
                    referredBy: null,
                    referralCount: 0,
                    referralEarnings: 0,
                    dailyAdWatchedCount: 0,
                    lastAdWatchDate: today,
                    oneTimeTasksCompleted: []
                };
                await db.ref(`users/${currentUserId}`).set(currentUserData);
                
                // Check referral from URL param
                const urlParams = new URLSearchParams(window.location.hash.split('?')[1]);
                const referrer = urlParams.get('startapp') || urlParams.get('ref');
                if(referrer && referrer !== currentUserId) {
                    await handleReferral(referrer);
                }
            } else {
                currentUserData = snapshot.val();
                // Streak check
                const today = new Date().toDateString();
                const lastLogin = currentUserData.lastLoginDate;
                if(lastLogin !== today) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    if(lastLogin === yesterday.toDateString()) {
                        currentUserData.loginStreak = (currentUserData.loginStreak || 0) + 1;
                    } else {
                        currentUserData.loginStreak = 1;
                    }
                    currentUserData.lastLoginDate = today;
                    await db.ref(`users/${currentUserId}`).update({ loginStreak: currentUserData.loginStreak, lastLoginDate: today });
                }
            }
        }

        async function handleReferral(referrerId) {
            const referrerRef = db.ref(`users/${referrerId}`);
            const referrerSnap = await referrerRef.once('value');
            if(referrerSnap.exists() && !currentUserData.referredBy) {
                currentUserData.referredBy = referrerId;
                await db.ref(`users/${currentUserId}`).update({ referredBy: referrerId });
                
                // Add referral reward
                const reward = settings.referralRewardPoints || 50;
                await referrerRef.child('balance').transaction(b => (b || 0) + reward);
                await referrerRef.child('totalEarned').transaction(b => (b || 0) + reward);
                await referrerRef.child('referralCount').transaction(b => (b || 0) + 1);
                await referrerRef.child('referralEarnings').transaction(b => (b || 0) + reward);
            }
        }

        async function addPoints(amount, type = 'ad') {
            if(currentUserData.isBanned) { alert("You are banned!"); return false; }
            await db.ref(`users/${currentUserId}/balance`).transaction(b => (b || 0) + amount);
            await db.ref(`users/${currentUserId}/totalEarned`).transaction(b => (b || 0) + amount);
            if(type === 'ad') {
                await db.ref(`users/${currentUserId}/totalTasksCompleted`).transaction(b => (b || 0) + 1);
            }
            currentUserData.balance += amount;
            currentUserData.totalEarned += amount;
            renderCurrentPage();
            return true;
        }

        // Monetag Ad Integration
        function showRewardedAd(onComplete) {
            if(showingAd) return;
            showingAd = true;
            
            // Simulate ad showing - In production, integrate actual Monetag SDK
            // For demo, we'll use a setTimeout to simulate ad completion
            const adContainer = document.createElement('div');
            adContainer.style.position = 'fixed';
            adContainer.style.top = '0';
            adContainer.style.left = '0';
            adContainer.style.width = '100%';
            adContainer.style.height = '100%';
            adContainer.style.background = 'black';
            adContainer.style.zIndex = '9999';
            adContainer.style.display = 'flex';
            adContainer.style.alignItems = 'center';
            adContainer.style.justifyContent = 'center';
            adContainer.style.color = 'white';
            adContainer.innerHTML = '<div style="text-align:center"><i class="fas fa-play-circle" style="font-size:50px"></i><p>Watching Ad... (3s)</p></div>';
            document.body.appendChild(adContainer);
            
            setTimeout(() => {
                document.body.removeChild(adContainer);
                showingAd = false;
                if(onComplete) onComplete(true);
            }, 3000);
        }

        async function watchAd() {
            if(currentUserData.isBanned) { alert("You are banned!"); return; }
            
            const today = new Date().toDateString();
            if(currentUserData.lastAdWatchDate !== today) {
                currentUserData.dailyAdWatchedCount = 0;
                currentUserData.lastAdWatchDate = today;
                await db.ref(`users/${currentUserId}`).update({ dailyAdWatchedCount: 0, lastAdWatchDate: today });
            }
            
            if(currentUserData.dailyAdWatchedCount >= (settings.dailyAdLimit || 20)) {
                alert(`Daily ad limit reached! Max ${settings.dailyAdLimit} ads per day.`);
                return;
            }
            
            showRewardedAd(async (completed) => {
                if(completed) {
                    await db.ref(`users/${currentUserId}/dailyAdWatchedCount`).transaction(b => (b || 0) + 1);
                    currentUserData.dailyAdWatchedCount++;
                    await addPoints(settings.adRewardPoints || 20, 'ad');
                    renderAdsPage();
                    alert(`+${settings.adRewardPoints} points earned!`);
                }
            });
        }

        async function completeOneTimeTask(task) {
            if(currentUserData.oneTimeTasksCompleted?.includes(task.id)) {
                alert("Task already completed!");
                return;
            }
            // Open task link
            window.open(task.linkUrl, '_blank');
            await addPoints(task.rewardPoints, 'task');
            currentUserData.oneTimeTasksCompleted = currentUserData.oneTimeTasksCompleted || [];
            currentUserData.oneTimeTasksCompleted.push(task.id);
            await db.ref(`users/${currentUserId}/oneTimeTasksCompleted`).set(currentUserData.oneTimeTasksCompleted);
            renderAdsPage();
            alert(`+${task.rewardPoints} points earned!`);
        }

        async function requestWithdrawal(method, amount, account) {
            const minAmount = settings.minWithdrawAmount || 100;
            if(amount < minAmount) { alert(`Minimum withdrawal amount is ${minAmount} points`); return; }
            if(amount > currentUserData.balance) { alert("Insufficient balance!"); return; }
            
            const withdrawId = Date.now().toString();
            const withdrawData = {
                userId: currentUserId,
                amount: amount,
                method: method,
                accountNumber: account,
                status: 'pending',
                timestamp: Date.now()
            };
            await db.ref(`withdrawals/${withdrawId}`).set(withdrawData);
            alert("Withdrawal request submitted successfully!");
            closeModal();
            renderWithdrawPage();
        }

        async function getRank() {
            const users = await db.ref('users').once('value');
            let rankings = [];
            users.forEach(u => {
                if(u.val().totalEarned) rankings.push({ id: u.key, earnings: u.val().totalEarned });
            });
            rankings.sort((a,b) => b.earnings - a.earnings);
            const rank = rankings.findIndex(r => r.id === currentUserId) + 1;
            return rank > 0 ? rank : rankings.length + 1;
        }

        // Rendering functions
        async function renderHome() {
            const rank = await getRank();
            const bdt = (currentUserData.balance / (settings.pointsToBdtRate || 5000) * 100).toFixed(2);
            const html = `
                <div class="glass-card">
                    <h2>INFINITY EARN</h2>
                    <div class="stats-grid">
                        <div class="stat-item"><div class="stat-value">${currentUserData.balance}</div><div class="stat-label">${t('balance')}</div></div>
                        <div class="stat-item"><div class="stat-value">$${bdt}</div><div class="stat-label">USD Value</div></div>
                        <div class="stat-item"><div class="stat-value">${currentUserData.totalEarned || 0}</div><div class="stat-label">${t('lifetimeEarnings')}</div></div>
                        <div class="stat-item"><div class="stat-value">${currentUserData.totalTasksCompleted || 0}</div><div class="stat-label">${t('tasksCompleted')}</div></div>
                        <div class="stat-item"><div class="stat-value">${currentUserData.loginStreak || 1}🔥</div><div class="stat-label">${t('streak')}</div></div>
                        <div class="stat-item"><div class="stat-value">#${rank}</div><div class="stat-label">${t('rank')}</div></div>
                    </div>
                </div>
                <div class="glass-card"><h3>Quick Actions</h3><button class="btn-primary" onclick="document.querySelector('[data-page=\\'ads\\']').click()">${t('watchAd')}</button></div>
            `;
            document.getElementById('home-page').innerHTML = html;
        }

        async function renderAdsPage() {
            const today = new Date().toDateString();
            const watched = currentUserData.lastAdWatchDate === today ? (currentUserData.dailyAdWatchedCount || 0) : 0;
            const limit = settings.dailyAdLimit || 20;
            const completedTasks = currentUserData.oneTimeTasksCompleted || [];
            
            let tasksHtml = '<h3>One-Time Tasks</h3>';
            for(let task of oneTimeTasks) {
                const completed = completedTasks.includes(task.id);
                tasksHtml += `
                    <div class="task-item">
                        <img src="${task.logoUrl || 'https://via.placeholder.com/50'}" class="task-logo" onerror="this.src='https://via.placeholder.com/50'">
                        <div style="flex:1"><strong>${task.title}</strong><br><small>Reward: ${task.rewardPoints} pts</small></div>
                        ${!completed ? `<button class="btn-secondary" onclick="completeOneTimeTask(${JSON.stringify(task).replace(/"/g, '&quot;')})">Complete</button>` : '<span>✅ Done</span>'}
                    </div>
                `;
            }
            
            const html = `
                <div class="glass-card">
                    <h3>Daily Ads</h3>
                    <div class="ad-progress">Progress: ${watched}/${limit} ads today</div>
                    <button class="btn-primary" onclick="watchAd()">Watch Rewarded Ad (+${settings.adRewardPoints || 20} pts)</button>
                </div>
                <div class="glass-card">
                    ${tasksHtml}
                </div>
            `;
            document.getElementById('ads-page').innerHTML = html;
        }

        async function renderReferPage() {
            const link = `https://t.me/INFINITY_EARN_BOT?start=${currentUserId}`;
            const html = `
                <div class="glass-card">
                    <h3>Refer & Earn Forever</h3>
                    <div class="stat-item"><div class="stat-value">${currentUserData.referralCount || 0}</div><div class="stat-label">Total Referrals</div></div>
                    <div class="stat-item"><div class="stat-value">${currentUserData.referralEarnings || 0}</div><div class="stat-label">Referral Earnings</div></div>
                    <input type="text" id="referral-link" value="${link}" readonly style="width:100%; margin:10px 0; padding:10px; border-radius:12px">
                    <button class="btn-primary" onclick="copyReferralLink()">Copy Referral Link <i class="fas fa-copy"></i></button>
                </div>
            `;
            document.getElementById('refer-page').innerHTML = html;
        }

        async function renderWithdrawPage() {
            const bdtValue = (currentUserData.balance / (settings.pointsToBdtRate || 5000) * 100).toFixed(2);
            const snapshot = await db.ref('withdrawals').orderByChild('userId').equalTo(currentUserId).once('value');
            let historyHtml = '<h3>Withdrawal History</h3>';
            snapshot.forEach(w => {
                const wd = w.val();
                historyHtml += `<div class="withdraw-history-item">${wd.amount} pts - ${wd.method} - <span style="color:${wd.status === 'approved' ? 'green' : wd.status === 'rejected' ? 'red' : 'orange'}">${wd.status}</span></div>`;
            });
            
            const html = `
                <div class="glass-card">
                    <h3>Withdraw Funds</h3>
                    <div class="stat-item"><div class="stat-value">${currentUserData.balance} pts</div><div class="stat-label">≈ $${bdtValue} BDT</div></div>
                    <button class="btn-primary" onclick="openWithdrawModal()">Request Withdrawal</button>
                </div>
                <div class="glass-card">
                    ${historyHtml}
                </div>
            `;
            document.getElementById('withdraw-page').innerHTML = html;
        }

        async function renderProfilePage() {
            // Load notifications
            const notifSnapshot = await db.ref('admin/notifications').orderByChild('timestamp').once('value');
            let notificationsHtml = '<h3>Notifications</h3>';
            notifSnapshot.forEach(n => {
                const notif = n.val();
                if(!notif.targetUserId || notif.targetUserId === currentUserId) {
                    notificationsHtml += `<div class="withdraw-history-item">📢 ${notif.message}</div>`;
                }
            });
            
            const html = `
                <div class="glass-card" style="text-align:center">
                    <img src="https://avatars.dicebear.com/api/avataaars/${currentUserId}.svg" style="width:80px; height:80px; border-radius:50%; margin-bottom:10px">
                    <h3>${currentUserData.username}</h3>
                    <div style="margin: 15px 0">
                        <button class="btn-secondary" onclick="toggleTheme()"><i class="fas fa-moon"></i> Dark/Light</button>
                        <button class="btn-secondary" onclick="toggleLanguage()"><i class="fas fa-language"></i> ${currentLang === 'en' ? 'বাংলা' : 'English'}</button>
                        <button class="btn-secondary" onclick="window.open('${settings.supportLink || '#'}', '_blank')"><i class="fas fa-headset"></i> Support</button>
                    </div>
                    ${notificationsHtml}
                </div>
            `;
            document.getElementById('profile-page').innerHTML = html;
        }

        // Utility functions
        function copyReferralLink() {
            const link = document.getElementById('referral-link');
            link.select();
            document.execCommand('copy');
            alert("Link copied!");
        }
        
        function openWithdrawModal() { document.getElementById('withdraw-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('withdraw-modal').style.display = 'none'; }
        
        document.getElementById('submit-withdraw').onclick = () => {
            const method = document.getElementById('withdraw-method').value;
            const amount = parseInt(document.getElementById('withdraw-amount').value);
            const account = document.getElementById('withdraw-account').value;
            if(amount && account) requestWithdrawal(method, amount, account);
            else alert("Please fill all fields");
        };
        
        function toggleTheme() { document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); }
        function toggleLanguage() { currentLang = currentLang === 'en' ? 'bn' : 'en'; renderCurrentPage(); }
        
        function setupEventListeners() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.onclick = () => {
                    const page = item.dataset.page;
                    currentPage = page;
                    renderCurrentPage();
                };
            });
            const savedTheme = localStorage.getItem('theme');
            if(savedTheme === 'dark') document.body.classList.add('dark');
        }
        
        function renderCurrentPage() {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`${currentPage}-page`).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(item => {
                if(item.dataset.page === currentPage) item.classList.add('active');
                else item.classList.remove('active');
            });
            if(currentPage === 'home') renderHome();
            else if(currentPage === 'ads') renderAdsPage();
            else if(currentPage === 'refer') renderReferPage();
            else if(currentPage === 'withdraw') renderWithdrawPage();
            else if(currentPage === 'profile') renderProfilePage();
        }
        
        // Expose global functions
        window.watchAd = watchAd;
        window.completeOneTimeTask = completeOneTimeTask;
        window.copyReferralLink = copyReferralLink;
        window.openWithdrawModal = openWithdrawModal;
        window.closeModal = closeModal;
        window.toggleTheme = toggleTheme;
        window.toggleLanguage = toggleLanguage;
        
        init();
    </script>
</body>
</html>
