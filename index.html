<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Self Click Bot | Earn by Watching Ads</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #0a0f1e, #0c1222);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px;
    }

    .header h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #FFD966, #FFA500);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .header p {
      color: #9aa9c1;
      font-size: 12px;
      margin-top: 6px;
    }

    /* Main Card */
    .card {
      background: rgba(18, 28, 45, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 24px;
      border: 1px solid rgba(255, 180, 70, 0.3);
      margin-bottom: 20px;
    }

    /* Stats Display */
    .stats {
      text-align: center;
      margin-bottom: 24px;
    }

    .stats .label {
      font-size: 14px;
      color: #9aa9c1;
      letter-spacing: 1px;
    }

    .stats .count {
      font-size: 64px;
      font-weight: 800;
      background: linear-gradient(135deg, #FFD966, #FFA500);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin: 8px 0;
    }

    .stats .sub {
      font-size: 12px;
      color: #6a75a0;
    }

    /* Progress Bar */
    .progress-container {
      margin: 20px 0;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #9aa9c1;
      margin-bottom: 8px;
    }

    .progress-bar {
      background: #1e253f;
      height: 8px;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, #FFD966, #FFA500);
      height: 100%;
      width: 0%;
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    /* Watch Button */
    .watch-btn {
      background: linear-gradient(135deg, #FFA500, #FF7E05);
      border: none;
      width: 100%;
      padding: 18px;
      border-radius: 60px;
      font-size: 18px;
      font-weight: 800;
      color: #1a1509;
      cursor: pointer;
      transition: 0.2s;
      margin: 16px 0;
      box-shadow: 0 8px 20px rgba(255, 110, 0, 0.3);
    }

    .watch-btn:active {
      transform: scale(0.97);
    }

    .watch-btn:disabled {
      background: #4a4a4a;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Reward Display */
    .reward-info {
      background: rgba(42, 109, 245, 0.15);
      border-radius: 20px;
      padding: 12px;
      text-align: center;
      margin: 16px 0;
    }

    .reward-amount {
      font-size: 20px;
      font-weight: 700;
      color: #FFD966;
    }

    /* Total Earned */
    .earned-card {
      background: rgba(18, 28, 45, 0.6);
      border-radius: 24px;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(72, 187, 255, 0.2);
    }

    .earned-label {
      font-size: 12px;
      color: #9aa9c1;
    }

    .earned-amount {
      font-size: 28px;
      font-weight: 800;
      color: #FFD966;
    }

    /* Toast Message */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e253f;
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 14px;
      z-index: 1000;
      white-space: nowrap;
      border-left: 4px solid #FFA500;
    }

    /* Admin Panel Toggle Button */
    .admin-toggle {
      background: rgba(42, 109, 245, 0.2);
      border: 1px solid #2a6df5;
      color: #2a6df5;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
    }

    .admin-toggle:active {
      background: rgba(42, 109, 245, 0.4);
    }

    /* Admin Panel */
    .admin-panel {
      background: rgba(18, 28, 45, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 20px;
      margin-top: 16px;
      border: 1px solid #2a6df5;
      display: none;
    }

    .admin-panel.show {
      display: block;
    }

    .admin-title {
      font-size: 16px;
      font-weight: 700;
      color: #FFD966;
      margin-bottom: 16px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #9aa9c1;
      margin-bottom: 6px;
    }

    .input-group input, .input-group textarea {
      width: 100%;
      background: #0c1222;
      border: 1px solid #2d3a5e;
      padding: 12px 14px;
      border-radius: 16px;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .input-group input:focus, .input-group textarea:focus {
      border-color: #FFA500;
    }

    .admin-btn {
      background: #2a6df5;
      border: none;
      padding: 12px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .admin-btn-danger {
      background: #ef4444;
    }

    .admin-btn-warning {
      background: #f59e0b;
    }

    .ad-link-display {
      background: #0c1222;
      padding: 10px;
      border-radius: 16px;
      font-size: 11px;
      color: #6a75a0;
      word-break: break-all;
      margin-top: 8px;
    }

    /* Loading Spinner */
    .loading {
      text-align: center;
      padding: 40px;
      color: #9aa9c1;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 10px;
      color: #4a5578;
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <div class="loading">Loading...</div>
</div>

<script>
  // ========== FIREBASE CONFIGURATION (Your Firebase Config) ==========
  const firebaseConfig = {
    apiKey: "AIzaSyB8leAjKEjUJAtF5TE43EO-HduxwpCSxIU",
    authDomain: "infinity-earn-286dc.firebaseapp.com",
    databaseURL: "https://infinity-earn-286dc-default-rtdb.firebaseio.com",
    projectId: "infinity-earn-286dc",
    storageBucket: "infinity-earn-286dc.firebasestorage.app",
    messagingSenderId: "552917641589",
    appId: "1:552917641589:web:a5a7b6c39ebc5959a38b3c"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // ========== ADMIN PASSWORD ==========
  const ADMIN_PASSWORD = "myadmin123";

  // ========== GLOBAL VARIABLES ==========
  let currentUser = null;
  let userId = null;
  let settings = {
    rewardPerAd: 0.50,
    dailyLimit: 50,
    adLink: "https://www.google.com",
    adPlatform: "Monetag"
  };
  let adminLoggedIn = false;
  let showAdminPanel = false;

  // ========== GET OR CREATE USER ==========
  async function getOrCreateUser() {
    // Try to get user from Telegram first
    const tg = window.Telegram?.WebApp;
    const telegramUser = tg?.initDataUnsafe?.user;
    
    // Generate unique user ID (from Telegram or random)
    if (telegramUser?.id) {
      userId = `tg_${telegramUser.id}`;
    } else {
      // Check if user exists in localStorage for persistence
      const savedUserId = localStorage.getItem('selfbot_userId');
      if (savedUserId) {
        userId = savedUserId;
      } else {
        userId = `user_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
        localStorage.setItem('selfbot_userId', userId);
      }
    }

    try {
      const userRef = database.ref(`users/${userId}`);
      const snapshot = await userRef.once('value');
      const userData = snapshot.val();

      if (!userData) {
        // Create new user
        const newUser = {
          name: telegramUser?.first_name || "User",
          totalClicks: 0,
          dailyClicks: 0,
          totalEarned: 0,
          lastDate: new Date().toDateString(),
          createdAt: Date.now()
        };
        await userRef.set(newUser);
        currentUser = newUser;
      } else {
        currentUser = userData;
        
        // Check if date changed (reset daily counter)
        const today = new Date().toDateString();
        if (currentUser.lastDate !== today) {
          currentUser.dailyClicks = 0;
          currentUser.lastDate = today;
          await userRef.update({ dailyClicks: 0, lastDate: today });
        }
      }
      return true;
    } catch (error) {
      console.error("Firebase error:", error);
      showToast("Connection error. Please try again.", true);
      return false;
    }
  }

  // ========== LOAD SETTINGS FROM FIREBASE ==========
  async function loadSettings() {
    try {
      const settingsRef = database.ref('settings');
      const snapshot = await settingsRef.once('value');
      const savedSettings = snapshot.val();
      
      if (savedSettings) {
        settings = {
          rewardPerAd: savedSettings.rewardPerAd ?? 0.50,
          dailyLimit: savedSettings.dailyLimit ?? 50,
          adLink: savedSettings.adLink ?? "https://www.google.com",
          adPlatform: savedSettings.adPlatform ?? "Monetag"
        };
      } else {
        // Save default settings to Firebase
        await settingsRef.set(settings);
      }
      return true;
    } catch (error) {
      console.error("Error loading settings:", error);
      return false;
    }
  }

  // ========== SAVE SETTINGS TO FIREBASE ==========
  async function saveSettings() {
    try {
      await database.ref('settings').update({
        rewardPerAd: settings.rewardPerAd,
        dailyLimit: settings.dailyLimit,
        adLink: settings.adLink,
        adPlatform: settings.adPlatform
      });
      return true;
    } catch (error) {
      console.error("Error saving settings:", error);
      return false;
    }
  }

  // ========== UPDATE USER DATA ==========
  async function updateUserData(updates) {
    if (!userId) return false;
    try {
      await database.ref(`users/${userId}`).update(updates);
      if (currentUser) Object.assign(currentUser, updates);
      return true;
    } catch (error) {
      console.error("Error updating user:", error);
      return false;
    }
  }

  // ========== SHOW TOAST MESSAGE ==========
  function showToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = message;
    if (isError) toast.style.borderLeftColor = '#ef4444';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  // ========== OPEN AD LINK ==========
  async function openAdLink() {
    if (!currentUser) return;
    
    // Check daily limit
    if (currentUser.dailyClicks >= settings.dailyLimit) {
      showToast(`⚠️ Daily limit reached! Max ${settings.dailyLimit} ads per day.`, true);
      return;
    }

    // Open the ad link in a new tab
    const adWindow = window.open(settings.adLink, '_blank');
    if (!adWindow) {
      window.location.href = settings.adLink;
    }
    
    // After 2 seconds, give reward
    setTimeout(async () => {
      const reward = settings.rewardPerAd;
      
      const newTotalClicks = (currentUser.totalClicks || 0) + 1;
      const newDailyClicks = (currentUser.dailyClicks || 0) + 1;
      const newTotalEarned = (currentUser.totalEarned || 0) + reward;
      
      await updateUserData({
        totalClicks: newTotalClicks,
        dailyClicks: newDailyClicks,
        totalEarned: newTotalEarned
      });
      
      showToast(`+₹${reward.toFixed(2)} earned!`);
      render();
      
      // Haptic feedback
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      }
    }, 2000);
  }

  // ========== RESET USER DATA ==========
  async function resetUserData() {
    if (confirm('⚠️ Are you sure? This will reset all your earnings and click counts!')) {
      await updateUserData({
        totalClicks: 0,
        dailyClicks: 0,
        totalEarned: 0,
        lastDate: new Date().toDateString()
      });
      showToast('All data reset successfully!');
      render();
    }
  }

  // ========== ADMIN FUNCTIONS ==========
  function adminLogin(password) {
    if (password === ADMIN_PASSWORD) {
      adminLoggedIn = true;
      showAdminPanel = true;
      showToast('Admin logged in successfully!');
      render();
    } else {
      showToast('Wrong admin password!', true);
    }
  }

  function adminLogout() {
    adminLoggedIn = false;
    showAdminPanel = false;
    showToast('Admin logged out');
    render();
  }

  async function updateReward(value) {
    let newReward = parseFloat(value);
    if (isNaN(newReward) || newReward < 0) newReward = 0.50;
    settings.rewardPerAd = newReward;
    await saveSettings();
    showToast(`✅ Reward updated to ₹${newReward.toFixed(2)} per ad`);
    render();
  }

  async function updateLimit(value) {
    let newLimit = parseInt(value);
    if (isNaN(newLimit) || newLimit < 1) newLimit = 50;
    settings.dailyLimit = newLimit;
    await saveSettings();
    showToast(`✅ Daily limit updated to ${newLimit} ads`);
    render();
  }

  async function updateAdLink(value) {
    if (!value || value.trim() === "") {
      showToast('Please enter a valid URL', true);
      return;
    }
    let newLink = value.trim();
    if (!newLink.startsWith('http://') && !newLink.startsWith('https://')) {
      newLink = 'https://' + newLink;
    }
    settings.adLink = newLink;
    await saveSettings();
    showToast(`✅ Ad link updated! Users will now be redirected to: ${newLink}`);
    render();
  }

  async function updateAdPlatform(value) {
    if (!value || value.trim() === "") {
      showToast('Please enter platform name', true);
      return;
    }
    settings.adPlatform = value.trim();
    await saveSettings();
    showToast(`✅ Ad platform updated to: ${settings.adPlatform}`);
    render();
  }

  async function resetAllUserData() {
    if (confirm('⚠️ WARNING: This will reset ALL users earnings and ad counts! Are you sure?')) {
      try {
        const usersRef = database.ref('users');
        const snapshot = await usersRef.once('value');
        const updates = {};
        snapshot.forEach((child) => {
          updates[`${child.key}/totalClicks`] = 0;
          updates[`${child.key}/dailyClicks`] = 0;
          updates[`${child.key}/totalEarned`] = 0;
          updates[`${child.key}/lastDate`] = new Date().toDateString();
        });
        await usersRef.update(updates);
        if (currentUser) {
          currentUser.totalClicks = 0;
          currentUser.dailyClicks = 0;
          currentUser.totalEarned = 0;
          currentUser.lastDate = new Date().toDateString();
        }
        showToast('All user data has been reset!');
        render();
      } catch (error) {
        console.error("Error resetting data:", error);
        showToast("Error resetting data", true);
      }
    }
  }

  // ========== GET REMAINING ADS ==========
  function getRemainingAds() {
    if (!currentUser) return 0;
    return Math.max(0, settings.dailyLimit - (currentUser.dailyClicks || 0));
  }

  // ========== RENDER UI ==========
  async function render() {
    if (!currentUser) return;
    
    const app = document.getElementById('app');
    const remainingAds = getRemainingAds();
    const progressPercent = ((currentUser.dailyClicks || 0) / settings.dailyLimit) * 100;
    
    app.innerHTML = `
      <div class="header">
        <h1>🤖 Self Click Bot</h1>
        <p>Watch ads & earn money automatically</p>
      </div>

      <!-- Main Card -->
      <div class="card">
        <div class="stats">
          <div class="label">TODAY'S ADS WATCHED</div>
          <div class="count">${currentUser.dailyClicks || 0} / ${settings.dailyLimit}</div>
          <div class="sub">${remainingAds} ads remaining today</div>
        </div>

        <div class="progress-container">
          <div class="progress-label">
            <span>Daily Progress</span>
            <span>${Math.round(progressPercent)}%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progressPercent}%;"></div>
          </div>
        </div>

        <div class="reward-info">
          <span style="font-size:12px;">💰 Reward per ad</span>
          <div class="reward-amount">₹${settings.rewardPerAd.toFixed(2)}</div>
          <span style="font-size:10px; color:#6a75a0;">📢 Powered by ${settings.adPlatform}</span>
        </div>

        <button class="watch-btn" id="watchBtn" ${remainingAds === 0 ? 'disabled' : ''}>
          ${remainingAds === 0 ? '🎉 Daily Limit Reached' : `📺 Watch ${settings.adPlatform} Ad & Earn`}
        </button>

        <div style="font-size:11px; color:#6a75a0; text-align:center;">
          ⚡ Click the button above to watch an ad and earn money
        </div>
      </div>

      <!-- Total Earnings Card -->
      <div class="earned-card">
        <div class="earned-label">💰 TOTAL EARNINGS</div>
        <div class="earned-amount">₹${(currentUser.totalEarned || 0).toFixed(2)}</div>
        <div class="earned-label" style="margin-top:8px;">📺 Total Ads Watched: ${currentUser.totalClicks || 0}</div>
      </div>

      <!-- Reset Button for User -->
      <button class="admin-toggle" id="resetUserBtn" style="background: rgba(239,68,68,0.2); border-color:#ef4444; color:#ef4444;">
        🔄 Reset My Data
      </button>

      <!-- Admin Login / Panel Toggle -->
      ${!adminLoggedIn ? `
        <div style="margin-top: 16px;">
          <button class="admin-toggle" id="toggleAdminBtn">🔐 Admin Login</button>
          <div id="adminLoginPanel" style="display: none; margin-top: 12px;">
            <input type="password" id="adminPasswordInput" placeholder="Enter admin password" style="width:100%; background:#0c1222; border:1px solid #2d3a5e; padding:12px; border-radius:16px; color:white; margin-bottom:8px;">
            <button id="adminLoginSubmitBtn" style="background:#2a6df5; border:none; padding:10px; border-radius:40px; color:white; width:100%;">Login</button>
          </div>
        </div>
      ` : `
        <button class="admin-toggle" id="toggleAdminPanelBtn">🛠️ ${showAdminPanel ? 'Hide' : 'Show'} Admin Panel</button>
        
        <div class="admin-panel ${showAdminPanel ? 'show' : ''}" id="adminPanel">
          <div class="admin-title">⚙️ Admin Control Panel (Firebase)</div>
          
          <div class="input-group">
            <label>💰 Reward Per Ad (₹)</label>
            <input type="number" id="rewardInput" step="0.10" value="${settings.rewardPerAd}" placeholder="Enter reward amount">
            <button class="admin-btn" id="updateRewardBtn">Update Reward</button>
          </div>
          
          <div class="input-group">
            <label>📊 Daily Ad Limit</label>
            <input type="number" id="limitInput" value="${settings.dailyLimit}" placeholder="Enter daily limit">
            <button class="admin-btn" id="updateLimitBtn">Update Daily Limit</button>
          </div>
          
          <div class="input-group">
            <label>🔗 Ad Link (Users will be redirected here)</label>
            <textarea id="adLinkInput" rows="2" placeholder="Enter ad link URL">${settings.adLink}</textarea>
            <button class="admin-btn" id="updateAdLinkBtn">Update Ad Link</button>
            <div class="ad-link-display">Current: ${settings.adLink.substring(0, 50)}${settings.adLink.length > 50 ? '...' : ''}</div>
          </div>
          
          <div class="input-group">
            <label>🏷️ Ad Platform Name</label>
            <input type="text" id="platformInput" value="${settings.adPlatform}" placeholder="e.g., Monetag, Google Ads">
            <button class="admin-btn" id="updatePlatformBtn">Update Platform Name</button>
          </div>
          
          <hr style="border-color:#2d3a5e; margin: 16px 0;">
          
          <button class="admin-btn admin-btn-danger" id="resetAllDataBtn">🔄 Reset ALL Users Data</button>
          <button class="admin-btn admin-btn-warning" id="logoutAdminBtn" style="margin-top:8px;">🚪 Logout from Admin</button>
        </div>
      `}

      <div class="footer">
        Self Click Bot • Data stored in Firebase Cloud
      </div>
    `;

    // Bind events
    document.getElementById('watchBtn')?.addEventListener('click', openAdLink);
    document.getElementById('resetUserBtn')?.addEventListener('click', resetUserData);
    
    if (!adminLoggedIn) {
      const toggleAdminBtn = document.getElementById('toggleAdminBtn');
      const adminLoginPanel = document.getElementById('adminLoginPanel');
      
      if (toggleAdminBtn) {
        toggleAdminBtn.addEventListener('click', () => {
          if (adminLoginPanel.style.display === 'none') {
            adminLoginPanel.style.display = 'block';
          } else {
            adminLoginPanel.style.display = 'none';
          }
        });
      }
      
      const loginSubmitBtn = document.getElementById('adminLoginSubmitBtn');
      if (loginSubmitBtn) {
        loginSubmitBtn.addEventListener('click', () => {
          const password = document.getElementById('adminPasswordInput')?.value;
          adminLogin(password);
        });
      }
    } else {
      const toggleAdminPanelBtn = document.getElementById('toggleAdminPanelBtn');
      if (toggleAdminPanelBtn) {
        toggleAdminPanelBtn.addEventListener('click', () => {
          showAdminPanel = !showAdminPanel;
          render();
        });
      }
      
      document.getElementById('updateRewardBtn')?.addEventListener('click', () => {
        const input = document.getElementById('rewardInput');
        updateReward(input.value);
      });
      
      document.getElementById('updateLimitBtn')?.addEventListener('click', () => {
        const input = document.getElementById('limitInput');
        updateLimit(input.value);
      });
      
      document.getElementById('updateAdLinkBtn')?.addEventListener('click', () => {
        const input = document.getElementById('adLinkInput');
        updateAdLink(input.value);
      });
      
      document.getElementById('updatePlatformBtn')?.addEventListener('click', () => {
        const input = document.getElementById('platformInput');
        updateAdPlatform(input.value);
      });
      
      document.getElementById('resetAllDataBtn')?.addEventListener('click', resetAllUserData);
      document.getElementById('logoutAdminBtn')?.addEventListener('click', adminLogout);
    }
  }

  // ========== TELEGRAM WEBAPP INIT ==========
  function initTelegram() {
    if (window.Telegram?.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.expand();
      tg.enableClosingConfirmation();
      tg.setHeaderColor('bg_color');
      tg.setBackgroundColor('#0a0f1e');
    }
  }

  // ========== INITIALIZE APP ==========
  async function init() {
    initTelegram();
    
    // Show loading
    document.getElementById('app').innerHTML = '<div class="loading">Loading...</div>';
    
    // Load data from Firebase
    const settingsLoaded = await loadSettings();
    const userLoaded = await getOrCreateUser();
    
    if (settingsLoaded && userLoaded) {
      render();
    } else {
      document.getElementById('app').innerHTML = `
        <div class="card" style="text-align:center; padding:40px;">
          <h3>⚠️ Connection Error</h3>
          <p style="margin-top:12px;">Unable to connect to Firebase. Please check your internet connection and try again.</p>
          <button onclick="location.reload()" style="margin-top:20px; background:#2a6df5; border:none; padding:12px 24px; border-radius:40px; color:white;">Retry</button>
        </div>
      `;
    }
  }

  // Start the app
  init();
</script>
</body>
</html>
