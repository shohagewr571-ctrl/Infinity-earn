<script>
  // Firebase Configuration - আপনার দেওয়া কনফিগ
  const firebaseConfig = {
  apiKey: "AIzaSyB8leAjKEjUJAtF5TE43EO-HduxwpCSxIU",
  authDomain: "infinity-earn-286dc.firebaseapp.com",
  databaseURL: "https://infinity-earn-286dc-default-rtdb.firebaseio.com",
  projectId: "infinity-earn-286dc",
  storageBucket: "infinity-earn-286dc.firebasestorage.app",
  messagingSenderId: "552917641589",
  appId: "1:552917641589:web:a5a7b6c39ebc5959a38b3c",
};

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.expand();
    tg.enableClosingConfirmation();
  }

  const MONETAG_ZONE_ID = "11129283";
  
  let currentUser = null;
  let userId = null;
  let currentPage = "dashboard";
  let globalSettings = null;

  // Load Settings from Firebase
  async function loadSettings() {
    try {
      const settingsRef = database.ref('settings');
      const snapshot = await settingsRef.once('value');
      if (snapshot.exists()) {
        globalSettings = snapshot.val();
      } else {
        globalSettings = {
          adReward: 30,
          dailyAdLimit: 20,
          adsPerBundle: 3,
          minWithdraw: 50,
          dailyBonusReward: 10,
          dailyBonusAds: 4,
          signupBonus: 10,
          referralBonus: 25
        };
        await settingsRef.set(globalSettings);
      }
    } catch (error) {
      console.error("Settings load error:", error);
      // Fallback settings
      globalSettings = {
        adReward: 30, dailyAdLimit: 20, adsPerBundle: 3,
        minWithdraw: 50, dailyBonusReward: 10, dailyBonusAds: 4,
        signupBonus: 10, referralBonus: 25
      };
    }
    return globalSettings;
  }

  function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
    if (tg) tg.HapticFeedback?.impactOccurred('light');
  }

  // Real Monetag Ad Show Function
  function showMonetagAd(callback) {
    const modal = document.createElement('div');
    modal.className = 'ad-modal';
    modal.innerHTML = `
      <div class="ad-modal-content">
        <div style="font-size: 48px; margin-bottom: 10px;">🎬</div>
        <h3>Monetag Ad</h3>
        <p style="margin: 10px 0; color: var(--text-gray);">Please watch this ad to continue</p>
        <div id="monetag-ad-container" style="min-height: 250px; margin: 16px 0;"></div>
        <div style="font-size: 12px; color: var(--text-gray);">Ad will close automatically after completion</div>
      </div>
    `;
    
    document.body.appendChild(modal);
    
    const adContainer = document.getElementById('monetag-ad-container');
    if (adContainer && typeof show_11129283 !== 'undefined') {
      try {
        show_11129283(adContainer);
      } catch(e) {
        console.error("Ad load error:", e);
        setTimeout(() => {
          modal.remove();
          if (callback) callback(true);
        }, 5000);
        return;
      }
    } else {
      setTimeout(() => {
        modal.remove();
        if (callback) callback(true);
      }, 5000);
      return;
    }
    
    let adCompleted = false;
    setTimeout(() => {
      if (!adCompleted) {
        adCompleted = true;
        modal.remove();
        if (callback) callback(true);
      }
    }, 10000);
    
    const closeBtn = document.createElement('button');
    closeBtn.innerText = 'Close Ad';
    closeBtn.style.cssText = 'background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 40px; margin-top: 16px; cursor: pointer; width: 100%;';
    closeBtn.onclick = () => {
      if (!adCompleted) {
        adCompleted = true;
        modal.remove();
        if (callback) callback(true);
      }
    };
    modal.querySelector('.ad-modal-content').appendChild(closeBtn);
  }

  // Update User Data in Firebase
  async function updateUserData(data) {
    if (!userId) return;
    try {
      await database.ref(`users/${userId}`).update(data);
      if (currentUser) Object.assign(currentUser, data);
    } catch (error) {
      console.error("Firebase update error:", error);
      if (currentUser) Object.assign(currentUser, data);
    }
  }

  // Add Transaction
  async function addTransaction(type, amount) {
    if (!userId) return;
    const transaction = {
      type: type,
      amount: amount,
      date: new Date().toLocaleString(),
      timestamp: Date.now()
    };
    try {
      await database.ref(`users/${userId}/transactions`).push(transaction);
    } catch(e) { console.error(e); }
    if (currentUser) {
      if (!currentUser.transactions) currentUser.transactions = [];
      currentUser.transactions.unshift(transaction);
      if (currentUser.transactions.length > 20) currentUser.transactions.pop();
    }
  }

  // Add Earnings
  async function addEarnings(amount, source) {
    if (!currentUser) return;
    const newBalance = (currentUser.totalBalance || 0) + amount;
    const newWithdrawable = (currentUser.withdrawable || 0) + amount;
    const newTodayEarnings = (currentUser.todayEarnings || 0) + amount;
    const newTotalEarnings = (currentUser.totalEarnings || 0) + amount;
    
    await updateUserData({
      totalBalance: newBalance,
      withdrawable: newWithdrawable,
      todayEarnings: newTodayEarnings,
      totalEarnings: newTotalEarnings
    });
    
    await addTransaction(source, amount);
    
    showToast(`+₹${amount.toFixed(2)} from ${source}`);
    render();
  }

  // Watch 3 Ads Bundle
  async function startWatchingAds() {
    if (!currentUser || !globalSettings) return;
    if (currentUser.adLimit.used + globalSettings.adsPerBundle > currentUser.adLimit.max) {
      const remaining = currentUser.adLimit.max - currentUser.adLimit.used;
      if (remaining <= 0) {
        showToast("Daily ad limit reached! Come back tomorrow.");
        return;
      }
      showToast(`You can only watch ${remaining} more ads today`);
      return;
    }
    
    let currentAdIndex = 0;
    const totalAds = globalSettings.adsPerBundle;
    const rewardAmount = globalSettings.adReward;
    
    function showAdModal() {
      const modal = document.createElement('div');
      modal.className = 'ad-modal';
      modal.innerHTML = `
        <div class="ad-modal-content">
          <div style="font-size: 48px; margin-bottom: 10px;">📺</div>
          <h3>Watch Ads Bundle</h3>
          <div class="ad-counter">Ad ${currentAdIndex + 1} of ${totalAds}</div>
          <div style="width:100%; height:6px; background:#e0e0e0; border-radius:3px; margin:20px 0;">
            <div style="width:${(currentAdIndex / totalAds) * 100}%; height:100%; background:#3b82f6; border-radius:3px;"></div>
          </div>
          <p style="margin: 10px 0; color: var(--text-gray);">Complete all ${totalAds} ads to earn ${rewardAmount} points!</p>
          <button class="watch-btn-large" id="watchBundleAdBtn" style="background:#3b82f6; color:white;">Watch Ad ${currentAdIndex + 1}</button>
        </div>
      `;
      
      document.body.appendChild(modal);
      
      const watchBtn = document.getElementById('watchBundleAdBtn');
      if (watchBtn) {
        watchBtn.onclick = () => {
          modal.remove();
          showMonetagAd(async (success) => {
            if (success) {
              currentAdIndex++;
              const newAdLimit = { ...currentUser.adLimit, used: currentUser.adLimit.used + 1 };
              await updateUserData({ adLimit: newAdLimit });
              currentUser.adLimit.used++;
              
              if (currentAdIndex >= totalAds) {
                await addEarnings(rewardAmount, `${totalAds} Ads Bundle`);
                const newAdsWatched = (currentUser.adsWatched || 0) + totalAds;
                await updateUserData({ adsWatched: newAdsWatched });
                currentUser.adsWatched = newAdsWatched;
                showToast(`🎉 You earned ${rewardAmount} points!`);
              } else {
                showAdModal();
              }
            } else {
              showToast("Ad failed to load. Please try again.");
            }
          });
        };
      }
    }
    
    showAdModal();
  }

  // Daily Bonus
  async function startDailyBonus() {
    if (!currentUser || !globalSettings) return;
    if (currentUser.dailyBonusClaimed) {
      showToast("Already claimed today's bonus!");
      return;
    }
    
    if (currentUser.adLimit.used + globalSettings.dailyBonusAds > currentUser.adLimit.max) {
      const remaining = currentUser.adLimit.max - currentUser.adLimit.used;
      if (remaining <= 0) {
        showToast("Daily ad limit reached!");
        return;
      }
      showToast(`Only ${remaining} ads left today.`);
      return;
    }
    
    let currentAdIndex = 0;
    const totalAds = globalSettings.dailyBonusAds;
    const bonusReward = globalSettings.dailyBonusReward;
    
    function showAdModal() {
      const modal = document.createElement('div');
      modal.className = 'ad-modal';
      modal.innerHTML = `
        <div class="ad-modal-content">
          <div style="font-size: 48px; margin-bottom: 10px;">🎁</div>
          <h3>Daily Bonus</h3>
          <div class="ad-counter">Ad ${currentAdIndex + 1} of ${totalAds}</div>
          <div style="width:100%; height:6px; background:#e0e0e0; border-radius:3px; margin:20px 0;">
            <div style="width:${(currentAdIndex / totalAds) * 100}%; height:100%; background:#f59e0b; border-radius:3px;"></div>
          </div>
          <p style="margin: 10px 0;">Watch all ${totalAds} ads to earn ${bonusReward} points!</p>
          <button class="watch-btn-large" id="bonusAdBtn" style="background:#f59e0b; color:white;">Watch Ad ${currentAdIndex + 1}</button>
        </div>
      `;
      
      document.body.appendChild(modal);
      
      const watchBtn = document.getElementById('bonusAdBtn');
      if (watchBtn) {
        watchBtn.onclick = () => {
          modal.remove();
          showMonetagAd(async (success) => {
            if (success) {
              currentAdIndex++;
              const newAdLimit = { ...currentUser.adLimit, used: currentUser.adLimit.used + 1 };
              await updateUserData({ adLimit: newAdLimit });
              currentUser.adLimit.used++;
              
              if (currentAdIndex >= totalAds) {
                await addEarnings(bonusReward, "Daily Bonus");
                const newAdsWatched = (currentUser.adsWatched || 0) + totalAds;
                await updateUserData({ 
                  adsWatched: newAdsWatched,
                  dailyBonusClaimed: true 
                });
                currentUser.adsWatched = newAdsWatched;
                currentUser.dailyBonusClaimed = true;
                showToast(`🎉 You earned ${bonusReward} bonus points!`);
              } else {
                showAdModal();
              }
            } else {
              showToast("Ad failed to load.");
            }
          });
        };
      }
    }
    
    showAdModal();
  }

  // Complete Task
  async function completeTask(taskId) {
    const tasks = currentUser.tasks || [];
    const task = tasks.find(t => t.id === taskId);
    if (!task || task.completed) {
      showToast("Task already completed");
      return;
    }
    task.completed = true;
    await updateUserData({ tasks: tasks });
    currentUser.tasks = tasks;
    await addEarnings(task.reward, `Task: ${task.title}`);
  }

  // Request Withdrawal
  async function requestWithdrawWithAds(amount, method, accountNumber) {
    if (!currentUser || !globalSettings) return;
    if (amount > currentUser.withdrawable) {
      showToast("Insufficient balance");
      return false;
    }
    if (amount < globalSettings.minWithdraw) {
      showToast(`Minimum withdraw ₹${globalSettings.minWithdraw}`);
      return false;
    }
    if (!accountNumber || accountNumber.trim() === "") {
      showToast("Please enter account number");
      return false;
    }
    
    const remainingAds = currentUser.adLimit.max - currentUser.adLimit.used;
    if (remainingAds < 4) {
      showToast(`Need 4 verification ads. Only ${remainingAds} left.`);
      return false;
    }
    
    showToast("Starting verification. Please watch 4 ads.");
    
    let currentAdIndex = 0;
    const totalAds = 4;
    
    function showAdModal(resolve) {
      const modal = document.createElement('div');
      modal.className = 'ad-modal';
      modal.innerHTML = `
        <div class="ad-modal-content">
          <div style="font-size: 48px; margin-bottom: 10px;">🏧</div>
          <h3>Withdrawal Verification</h3>
          <div class="ad-counter">Ad ${currentAdIndex + 1} of ${totalAds}</div>
          <div style="width:100%; height:6px; background:#e0e0e0; border-radius:3px; margin:20px 0;">
            <div style="width:${(currentAdIndex / totalAds) * 100}%; height:100%; background:#10b981; border-radius:3px;"></div>
          </div>
          <button class="watch-btn-large" id="verifyAdBtn" style="background:#10b981; color:white;">Watch Ad ${currentAdIndex + 1}</button>
        </div>
      `;
      
      document.body.appendChild(modal);
      
      const watchBtn = document.getElementById('verifyAdBtn');
      if (watchBtn) {
        watchBtn.onclick = () => {
          modal.remove();
          showMonetagAd(async (success) => {
            if (success) {
              currentAdIndex++;
              const newAdLimit = { ...currentUser.adLimit, used: currentUser.adLimit.used + 1 };
              await updateUserData({ adLimit: newAdLimit });
              currentUser.adLimit.used++;
              
              if (currentAdIndex >= totalAds) {
                resolve(true);
              } else {
                showAdModal(resolve);
              }
            } else {
              showToast("Ad failed to load.");
              resolve(false);
            }
          });
        };
      }
    }
    
    const success = await new Promise((resolve) => { showAdModal(resolve); });
    
    if (success) {
      const newWithdrawable = currentUser.withdrawable - amount;
      const newTotalBalance = currentUser.totalBalance - amount;
      
      await updateUserData({
        withdrawable: newWithdrawable,
        totalBalance: newTotalBalance
      });
      
      const withdrawal = {
        amount: amount,
        status: "Completed",
        date: new Date().toLocaleDateString(),
        method: method,
        accountNumber: accountNumber,
        timestamp: Date.now()
      };
      
      try {
        await database.ref(`users/${userId}/withdrawals`).push(withdrawal);
      } catch(e) {}
      
      if (!currentUser.withdrawals) currentUser.withdrawals = [];
      currentUser.withdrawals.unshift(withdrawal);
      await addTransaction(`Withdraw to ${method}`, -amount);
      
      currentUser.withdrawable = newWithdrawable;
      currentUser.totalBalance = newTotalBalance;
      
      showToast(`✅ Withdrawal of ₹${amount} processed!`);
      render();
    }
    return success;
  }

    } catch (error) {
      console.error("Firebase init error, using fallback:", error);
      // Fallback to local user
      currentUser = {
        name: telegramUser?.first_name || "Rakib Hasan",
        level: 1,
        totalBalance: 10,
        withdrawable: 10,
        todayEarnings: 10,
        totalEarnings: 10,
        adsWatched: 0,
        dailyStreak: 1,
        referralCount: 0,
        referralEarnings: 0,
        referralLink: `https://t.me/infiniiearn_bot?start=${userId}`,
        adLimit: { used: 0, max: 20 },
        tasks: [
          { id: 1, title: "Follow on Twitter", reward: 2.00, completed: false, icon: "🐦" },
          { id: 2, title: "Join Telegram Channel", reward: 3.00, completed: false, icon: "📢" },
          { id: 3, title: "Visit Website", reward: 1.50, completed: false, icon: "🌐" }

        dailyBonusClaimed: false,
        transactions: [],
        withdrawals: []
      };

  function renderWallet() {

  function renderProfile() {

  function render() {
    if (!currentUser) return;
    
    const app = document.getElementById('app');
    let content = "";
    
    switch(currentPage) {
      case "dashboard": content = renderDashboard(); break;
      case "tasks": content = renderTasks(); break;
      case "wallet": content = renderWallet(); break;
      case "withdraw": content = renderWithdraw(); break;
      case "referral": content = renderReferral(); break;
      case "profile": content = renderProfile(); break;
      default: content = renderDashboard();
    }

    const navHtml = `
      <div class="bottom-nav">
        <button class="nav-item ${currentPage === 'dashboard' ? 'active' : ''}" data-page="dashboard"><span class="nav-icon">🏠</span><span>Home</span></button>
        <button class="nav-item ${currentPage === 'tasks' ? 'active' : ''}" data-page="tasks"><span class="nav-icon">🎯</span><span>Tasks</span></button>
        <button class="nav-item ${currentPage === 'wallet' ? 'active' : ''}" data-page="wallet"><span class="nav-icon">💰</span><span>Wallet</span></button>
        <button class="nav-item ${currentPage === 'withdraw' ? 'active' : ''}" data-page="withdraw"><span class="nav-icon">🏧</span><span>Withdraw</span></button>
        <button class="nav-item ${currentPage === 'referral' ? 'active' : ''}" data-page="referral"><span class="nav-icon">👥</span><span>Refer</span></button>
        <button class="nav-item ${currentPage === 'profile' ? 'active' : ''}" data-page="profile"><span class="nav-icon">👤</span><span>Profile</span></button>

    `;

    app.innerHTML = `

        <div class="header-top">

          <div class="user-info"><span class="level-badge">Level ${currentUser.level}</span><div class="avatar">${currentUser.name.charAt(0)}</div></div>
        </div>
      </div>
      ${content}
      ${navHtml}
    `;

    // Bind Events
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPage = btn.dataset.page;
        render();
        if (tg) tg.HapticFeedback?.impactOccurred('soft');
      });
    });

    const watchAdsBtn = document.getElementById('watchAdsBtn');
    if (watchAdsBtn) watchAdsBtn.addEventListener('click', () => startWatchingAds());

    const dailyBonusBtn = document.getElementById('dailyBonusBtn');
    if (dailyBonusBtn) dailyBonusBtn.addEventListener('click', () => startDailyBonus());

    document.querySelectorAll('[data-task-id]').forEach(btn => {
      const taskId = parseInt(btn.dataset.taskId);
      if (taskId) btn.addEventListener('click', () => completeTask(taskId));
    });

    const copyBtn2 = document.getElementById('copyLinkBtn2');
    if (copyBtn2) copyBtn2.onclick = () => { navigator.clipboard.writeText(currentUser.referralLink); showToast("Link copied!"); };
    
    const withdrawBtn = document.getElementById('submitWithdraw');
    if (withdrawBtn) withdrawBtn.onclick = () => {
      const amount = parseFloat(document.getElementById('withdrawAmount')?.value);
      const method = document.getElementById('withdrawMethod')?.value;
      const accountNumber = document.getElementById('accountNumber')?.value;
      if (amount && method && accountNumber) {
        requestWithdrawWithAds(amount, method, accountNumber);
      } else if (!accountNumber) {
        showToast("Please enter account number");
      } else if (!amount) {
        showToast("Please enter amount");
      }
    };
    
    const inviteBtn = document.getElementById('inviteBtn');
    if (inviteBtn) inviteBtn.onclick = () => { navigator.clipboard.writeText(currentUser.referralLink); showToast("Link copied!"); };
  }

  // Dark Mode
  function initTheme() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') document.body.classList.add('dark');
    document.addEventListener('click', (e) => {
      if (e.target.id === 'darkModeToggle') {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
      }
    });
  }
  
  initTheme();
  initUser();
</script>
